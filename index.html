<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Notes & Snippets</title>
  
  <!-- Favicon transparan untuk mencegah error -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <!-- Google Fonts: Inter (UI), Lora (Reading), JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Typography Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', 'sans-serif'], 
            serif: ['Lora', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          typography: (theme) => ({
            DEFAULT: {
              css: {
                fontFamily: 'Lora, serif',
                color: '#334155', // slate-700
                lineHeight: '1.8',
                h1: { fontFamily: 'Inter, sans-serif', color: '#0f172a', fontWeight: '700', letterSpacing: '-0.025em' },
                h2: { fontFamily: 'Inter, sans-serif', color: '#0f172a', fontWeight: '700', letterSpacing: '-0.025em', marginTop: '2em' },
                h3: { fontFamily: 'Inter, sans-serif', color: '#1e293b', fontWeight: '600' },
                p: { marginTop: '1.25em', marginBottom: '1.25em' },
                pre: { backgroundColor: '#0f172a', color: '#e2e8f0', padding: '1.25rem', borderRadius: '0.5rem', border: '1px solid #1e293b', fontSize: '0.875em' },
                code: { fontFamily: '"JetBrains Mono", monospace', color: '#0284c7', backgroundColor: '#f0f9ff', padding: '0.2em 0.4em', borderRadius: '0.25rem', fontWeight: '500', fontSize: '0.875em' },
                'code::before': { content: '""' },
                'code::after': { content: '""' },
                a: { color: '#2563eb', textDecoration: 'none', fontWeight: '500', transition: 'color 0.2s', '&:hover': { color: '#1e40af' } },
                blockquote: { borderLeftWidth: '4px', borderLeftColor: '#cbd5e1', fontStyle: 'italic', color: '#64748b', paddingLeft: '1.25rem', margin: '1.5rem 0' }
              }
            }
          })
        } 
      }
    }
  </script>
  
  <!-- DOMPurify (Security) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  
  <!-- Prism.js CSS (Tema Okaidia untuk kontras yang elegan) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
</head>
<body class="bg-white text-slate-900 antialiased font-sans selection:bg-blue-100 selection:text-blue-900">

  <!-- Navbar -->
  <nav class="border-b border-slate-100">
    <div class="max-w-4xl mx-auto py-5 px-6 flex justify-between items-center">
      <a href="/" class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
        DevNotes<span class="text-blue-600">.</span>
      </a>
      <div class="hidden sm:flex space-x-6 text-sm font-medium text-slate-500">
        <a href="#" class="hover:text-slate-900 transition-colors">Articles</a>
        <a href="#" class="hover:text-slate-900 transition-colors">Snippets</a>
        <a href="#" class="hover:text-slate-900 transition-colors">Projects</a>
      </div>
    </div>
  </nav>

  <!-- Header Section -->
  <header class="max-w-4xl mx-auto pt-16 pb-12 px-6">
    <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-slate-900 mb-4">Catatan & Eksplorasi Kode.</h1>
    <p class="text-lg text-slate-500 max-w-2xl leading-relaxed font-serif">Kumpulan artikel teknis, snippet kode, dan penyelesaian masalah seputar automasi, Google Workspace, dan pengembangan web.</p>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-4xl mx-auto pb-24 px-6 border-t border-slate-100 pt-12">
    
    <!-- Skeleton Loader (Animasi Loading Profesional) -->
    <div id="loading" class="space-y-16">
      <!-- Skeleton Item 1 -->
      <div class="animate-pulse">
        <div class="flex gap-2 mb-4"><div class="h-5 w-20 bg-slate-100 rounded"></div></div>
        <div class="h-8 w-3/4 bg-slate-100 rounded mb-4"></div>
        <div class="h-4 w-40 bg-slate-100 rounded mb-8"></div>
        <div class="space-y-3"><div class="h-4 bg-slate-50 rounded"></div><div class="h-4 bg-slate-50 rounded w-5/6"></div><div class="h-4 bg-slate-50 rounded w-4/6"></div></div>
      </div>
      <!-- Skeleton Item 2 -->
      <div class="animate-pulse">
        <div class="flex gap-2 mb-4"><div class="h-5 w-24 bg-slate-100 rounded"></div></div>
        <div class="h-8 w-2/3 bg-slate-100 rounded mb-4"></div>
        <div class="h-4 w-32 bg-slate-100 rounded mb-8"></div>
        <div class="space-y-3"><div class="h-4 bg-slate-50 rounded"></div><div class="h-4 bg-slate-50 rounded w-full"></div><div class="h-4 bg-slate-50 rounded w-3/4"></div></div>
      </div>
    </div>

    <!-- Container Artikel -->
    <div id="posts-container" class="space-y-20 hidden"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-100 py-10 text-center">
    <p class="text-sm text-slate-400 font-medium">&copy; 2026 DevNotes. Hosted on GitHub Pages, powered by GAS.</p>
  </footer>

  <!-- Script Prism -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <script>
    // URL API GAS Kamu (Sudah dikonfigurasi)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyUmgv6BRAlyGQqIwhIXm_I3NPi3j50EUSE-fpSmRhVQ8HbgsXQlr4JRRW1M6lNDuEr6Q/exec?action=getPosts";

    // Fungsi format tanggal yang rapi
    function formatDate(dateStr) {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateStr).toLocaleDateString('id-ID', options);
    }

    // Fungsi perkiraan waktu baca (opsional & profesional)
    function getReadingTime(text) {
      const wordsPerMinute = 200;
      const noOfWords = text.split(/\s/g).length;
      const minutes = noOfWords / wordsPerMinute;
      const readTime = Math.ceil(minutes);
      return `${readTime} min read`;
    }

    async function loadData() {
      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();
        
        const container = document.getElementById('posts-container');
        const loading = document.getElementById('loading');
        
        // Hapus loading
        loading.classList.add('hidden');
        container.classList.remove('hidden');

        if(result.success && result.data.length > 0) {
          result.data.reverse().forEach(post => {
            const cleanHTML = DOMPurify.sanitize(post.content);
            const readTime = getReadingTime(post.content);

            // Styling Tag yang sangat clean
            const tagsHTML = post.tags.split(',')
                .map(tag => `<span class="text-xs font-semibold text-blue-600 bg-blue-50/50 hover:bg-blue-100 transition-colors px-2.5 py-1 rounded-full uppercase tracking-wider">${tag.trim()}</span>`)
                .join(' ');

            const article = `
              <article class="group">
                <div class="flex flex-wrap gap-2 mb-4">
                  ${tagsHTML}
                </div>
                
                <h2 class="text-3xl sm:text-4xl font-bold mb-4 text-slate-900 tracking-tight leading-tight">
                  <a href="#${post.slug}" class="hover:text-blue-600 transition-colors decoration-2 underline-offset-4">${post.title}</a>
                </h2>
                
                <div class="text-sm text-slate-500 mb-8 flex items-center gap-3 font-medium">
                  <time>${formatDate(post.date)}</time>
                  <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                  <span>${readTime}</span>
                </div>
                
                <!-- Konten dengan Tailwind Typography (Prose) -->
                <div class="prose prose-lg max-w-none">
                  ${cleanHTML}
                </div>
              </article>
            `;
            container.insertAdjacentHTML('beforeend', article);
          });
          
          // Render sintaks kode
          Prism.highlightAll();
        } else {
          container.innerHTML = `
            <div class="text-center py-20">
              <p class="text-slate-500 text-lg font-serif italic">Belum ada artikel yang dipublikasikan.</p>
            </div>`;
        }
      } catch (e) {
        console.error(e);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('posts-container').classList.remove('hidden');
        document.getElementById('posts-container').innerHTML = `
          <div class="bg-red-50 border-l-4 border-red-500 p-6 rounded text-red-900">
            <h3 class="font-bold font-sans text-lg mb-1">Koneksi Terputus</h3>
            <p class="text-red-700 text-sm">Gagal mengambil data dari server. Pastikan API URL sudah diperbarui dengan deployment terbaru.</p>
          </div>`;
      }
    }

    // Eksekusi pemanggilan data
    loadData();
  </script>
</body>
</html>
