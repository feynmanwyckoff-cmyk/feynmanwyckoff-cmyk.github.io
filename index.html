<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulls, Bears, & Bugs - by Fayadh</title>
  
  <!-- Favicon B3 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23242424'/><text x='50' y='65' fill='white' font-family='Arial, sans-serif' font-weight='bold' font-size='45' text-anchor='middle'>B3</text></svg>">

  <!-- Google Fonts: Inter (UI/Heading), Lora (Reading Body), Fira Code (Code Blocks) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Typography Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', '-apple-system', 'sans-serif'], 
            serif: ['Lora', 'Georgia', 'serif'],
            mono: ['"Fira Code"', 'monospace']
          },
          colors: {
            medium: '#242424',
            mediumlight: '#6b6b6b'
          },
          typography: (theme) => ({
            DEFAULT: {
              css: {
                fontFamily: 'Lora, serif',
                color: '#242424',
                lineHeight: '2',
                fontSize: '1.125rem',
                h1: { fontFamily: 'Inter, sans-serif', fontWeight: '800', letterSpacing: '-0.03em', color: '#242424', lineHeight: '1.2' },
                h2: { fontFamily: 'Inter, sans-serif', fontWeight: '800', letterSpacing: '-0.02em', marginTop: '2em', color: '#242424' },
                h3: { fontFamily: 'Inter, sans-serif', fontWeight: '700', color: '#242424' },
                p: { color: '#242424' },
                pre: { backgroundColor: '#1e1e1e', color: '#d4d4d4', padding: '1.25rem', borderRadius: '0.75rem', fontSize: '0.875rem', fontFamily: '"Fira Code", monospace' },
                code: { fontFamily: '"Fira Code", monospace', fontWeight: '500' },
                a: { color: '#242424', textDecoration: 'underline', textUnderlineOffset: '4px', decorationThickness: '1px', '&:hover': { color: '#6b6b6b' } },
                img: { margin: '2rem auto', borderRadius: '1rem' }, /* Membuat gambar membulat mulus */
                blockquote: { borderLeftWidth: '3px', borderLeftColor: '#242424', fontStyle: 'italic', paddingLeft: '1.25rem', color: '#6b6b6b' }
              }
            }
          })
        } 
      }
    }
  </script>
  
  <!-- DOMPurify for Security -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  
  <!-- Prism.js (Syntax Highlighting) + Tomorrow Night Theme untuk tampilan terminal profesional -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css" rel="stylesheet" />
  
  <!-- Medium Zoom Library -->
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>

  <style>
    body { background-color: #ffffff; color: #242424; }
    
    /* Smooth Transition untuk pergantian SPA */
    .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animasi B3 Loading Berdenyut */
    .b3-loader { animation: pulseLogo 1.5s infinite ease-in-out; }
    @keyframes pulseLogo {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(36, 36, 36, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(36, 36, 36, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(36, 36, 36, 0); }
    }

    /* Kustomisasi tombol Copy dari Prism */
    div.code-toolbar > .toolbar a, div.code-toolbar > .toolbar button, div.code-toolbar > .toolbar span {
      background: #333 !important;
      color: #fff !important;
      border-radius: 0.375rem !important;
      padding: 0.25rem 0.75rem !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.75rem !important;
      transition: all 0.2s !important;
    }
    div.code-toolbar > .toolbar a:hover, div.code-toolbar > .toolbar button:hover {
      background: #555 !important;
    }

    .prose img { cursor: zoom-in; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
    .medium-zoom-overlay { z-index: 100; background: #ffffff !important; opacity: 0.95 !important;}
    .medium-zoom-image--opened { z-index: 101; border-radius: 4px !important; }
  </style>
</head>
<body class="antialiased font-sans">

  <!-- Global Header -->
  <header class="border-b border-gray-100 sticky top-0 bg-white/95 backdrop-blur-sm z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[65px] flex items-center justify-between">
      
      <!-- Brand / Logo -->
      <a href="#" onclick="window.location.hash=''; return false;" class="flex items-center gap-3 group">
        <div class="w-9 h-9 bg-medium text-white flex items-center justify-center font-sans font-bold text-lg rounded-full">B3</div>
        <span class="font-bold text-xl sm:text-2xl tracking-tight text-medium">Bulls, Bears, & Bugs</span>
      </a>

      <!-- Search Bar -->
      <div class="relative">
        <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="search-input" placeholder="Search notes..." class="pl-9 pr-4 py-2 bg-gray-50 hover:bg-gray-100 border-none rounded-full text-sm focus:ring-1 focus:ring-gray-300 outline-none w-48 sm:w-64 transition-all text-medium placeholder-gray-500">
      </div>
    </div>
  </header>

  <!-- HOME VIEW (Grid Utama & Sidebar Tag) -->
  <div id="home-view" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:flex gap-16">
    
    <!-- Bagian Kiri: Hero & Feed -->
    <div class="lg:w-[68%]">
      <!-- Hero Section -->
      <div class="mb-10 pb-10 border-b border-gray-100">
        <h1 class="text-[3rem] sm:text-[4rem] font-extrabold tracking-tighter text-medium leading-none mb-4">Stay curious.</h1>
        <p class="text-xl sm:text-2xl text-medium font-medium mb-4 tracking-tight">Membongkar yang rumit, menertawakan yang gagal.</p>
        <div class="border-l-4 border-medium pl-4 py-1">
           <p id="feynman-quote" class="text-lg text-mediumlight font-serif italic transition-opacity duration-500"></p>
        </div>
      </div>

      <div id="active-tag-info" class="hidden mb-6 text-sm font-semibold text-mediumlight uppercase tracking-widest border-b border-gray-100 pb-2"></div>

      <!-- Loading Animasi B3 -->
      <div id="loading" class="flex flex-col items-center justify-center py-20">
        <div class="w-16 h-16 bg-medium text-white flex items-center justify-center font-sans font-bold text-2xl rounded-full mb-4 b3-loader">B3</div>
      </div>

      <!-- Feed Container -->
      <div id="posts-container" class="flex flex-col"></div>

      <!-- Pagination -->
      <div id="pagination-controls" class="hidden flex items-center justify-between py-10 mt-6 border-t border-gray-100">
        <button id="btn-prev" class="text-sm font-medium text-medium hover:text-black disabled:opacity-30 border border-gray-200 rounded-full px-5 py-2 transition">← Newer</button>
        <span id="page-info" class="text-sm text-mediumlight font-medium"></span>
        <button id="btn-next" class="text-sm font-medium text-medium hover:text-black disabled:opacity-30 border border-gray-200 rounded-full px-5 py-2 transition">Older →</button>
      </div>
    </div>

    <!-- Bagian Kanan: Sidebar Archive & Tags -->
    <div class="hidden lg:block lg:w-[32%] relative">
      <div class="sticky top-[100px]">
        <h3 class="font-bold text-medium mb-4 text-base tracking-tight">Discover more of what matters to you</h3>
        <div id="tags-container" class="flex flex-wrap gap-2 mb-8">
           <!-- Tags dirender oleh JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ARTICLE VIEW (Mode Baca Lengkap) -->
  <div id="article-view" class="hidden bg-white min-h-screen pb-20">
    <div class="max-w-[680px] mx-auto px-4 sm:px-6 pt-12">
      <!-- Article Header -->
      <div id="article-header" class="mb-10"></div>
      
      <!-- Article Content -->
      <div id="article-content" class="prose prose-lg sm:prose-xl max-w-none prose-headings:font-bold prose-headings:tracking-tight prose-a:text-medium prose-p:leading-relaxed"></div>
      
      <!-- Article Footer -->
      <div class="mt-12 border-t border-gray-100 pt-8 pb-10">
         <div id="article-tags" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <!-- Script Prism & Plugins Copy to Clipboard -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
  <!-- Komponen Bahasa -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <script>
    // ⚠️ MASUKKAN URL API GAS KAMU DI BAWAH INI
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyUmgv6BRAlyGQqIwhIXm_I3NPi3j50EUSE-fpSmRhVQ8HbgsXQlr4JRRW1M6lNDuEr6Q/exec?action=getPosts";

    // --- RICHARD FEYNMAN QUOTES ---
    const quotes = [
      "The first principle is that you must not fool yourself and you are the easiest person to fool.",
      "What I cannot create, I do not understand.",
      "I think it's much more interesting to live not knowing than to have answers which might be wrong.",
      "Physics is to math what sex is to masturbation.",
      "Study hard what interests you the most in the most undisciplined, irreverent and original manner possible.",
      "Nobody ever figures out what life is all about, and it doesn't matter."
    ];
    document.getElementById('feynman-quote').innerHTML = `"${quotes[Math.floor(Math.random() * quotes.length)]}" <br><span class="text-sm font-sans font-semibold mt-2 block text-medium">— Richard Feynman</span>`;

    // --- GLOBAL VARIABLES ---
    let allPosts = [];
    let uniqueTags = new Set();
    let currentActiveTag = null;
    let currentPage = 1;
    const postsPerPage = 5;

    // DOM Elements
    const homeView = document.getElementById('home-view');
    const articleView = document.getElementById('article-view');
    const postsContainer = document.getElementById('posts-container');
    const tagsContainer = document.getElementById('tags-container');
    const searchInput = document.getElementById('search-input');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageInfo = document.getElementById('page-info');
    const paginationControls = document.getElementById('pagination-controls');
    const activeTagInfo = document.getElementById('active-tag-info');
    const loadingEl = document.getElementById('loading');

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    
    function getReadingTime(text) {
      const words = text.split(/\s/g).length;
      return `${Math.ceil(words / 200)} min read`;
    }

    function extractThumbnail(htmlContent) {
      const imgRegex = /<img[^>]+src="([^">]+)"/i;
      const match = htmlContent.match(imgRegex);
      return match ? match[1] : null;
    }

    function stripHtmlToText(html) {
      const tmp = document.createElement("DIV");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();
        
        if (result.success && result.data.length > 0) {
          allPosts = result.data.reverse();
          
          allPosts.forEach(post => {
            post.content = post.content.replace(/https:\/\/drive\.google\.com\/uc\?export=view(?:&amp;|&)id=([a-zA-Z0-9_-]+)/g, 'https://lh3.googleusercontent.com/d/$1');
            post.cleanHTML = DOMPurify.sanitize(post.content);
            post.thumbnail = extractThumbnail(post.cleanHTML);
            post.excerpt = stripHtmlToText(post.cleanHTML);
            
            post.tags.split(',').forEach(tag => {
              const cleanTag = tag.trim();
              if(cleanTag) uniqueTags.add(cleanTag);
            });
          });

          if(loadingEl) loadingEl.remove();
          renderTags();
          handleRouting(); 
        }
      } catch (e) {
        if(loadingEl) {
          loadingEl.innerHTML = `<p class="text-red-500 py-10">Gagal mengambil data. Cek koneksi atau URL API.</p>`;
        }
      }
    }

    function renderTags() {
      tagsContainer.innerHTML = Array.from(uniqueTags).map(tag => 
        `<button onclick="setTagFilter('${tag}')" class="bg-gray-100 hover:bg-gray-200 text-medium px-4 py-2 rounded-full text-sm font-medium transition-colors border border-transparent hover:border-gray-300">${tag}</button>`
      ).join('');
    }

    window.setTagFilter = function(tag) {
      currentActiveTag = tag;
      currentPage = 1;
      searchInput.value = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderFeed();
    };

    searchInput.addEventListener('input', (e) => {
      currentActiveTag = null;
      currentPage = 1;
      renderFeed(e.target.value.toLowerCase());
    });

    function renderFeed(searchQuery = '') {
      let filteredPosts = allPosts;
      
      if (currentActiveTag) {
        filteredPosts = allPosts.filter(p => p.tags.toLowerCase().includes(currentActiveTag.toLowerCase()));
        activeTagInfo.innerHTML = `Melihat Topik: <span class="text-medium ml-1">${currentActiveTag}</span> <button onclick="setTagFilter(null)" class="text-gray-400 hover:text-black normal-case font-normal ml-3 underline underline-offset-2">(Hapus Filter)</button>`;
        activeTagInfo.classList.remove('hidden');
      } else if (searchQuery) {
        filteredPosts = allPosts.filter(p => p.title.toLowerCase().includes(searchQuery) || p.excerpt.toLowerCase().includes(searchQuery));
        activeTagInfo.classList.add('hidden');
      } else {
        activeTagInfo.classList.add('hidden');
      }

      postsContainer.innerHTML = '';

      if (filteredPosts.length === 0) {
        postsContainer.innerHTML = `<p class="text-mediumlight py-10 font-serif italic">Belum ada catatan yang ditemukan.</p>`;
        paginationControls.classList.add('hidden');
        return;
      }

      const start = (currentPage - 1) * postsPerPage;
      const paginatedPosts = filteredPosts.slice(start, start + postsPerPage);

      paginatedPosts.forEach(post => {
        const thumbnailHTML = post.thumbnail 
          ? `<img src="${post.thumbnail}" alt="${post.title}" class="w-[96px] h-[96px] sm:w-[130px] sm:h-[130px] object-cover bg-gray-50 rounded-lg shadow-sm border border-gray-100">`
          : ``;

        // Update tipografi feed sesuai referensi yang baru
        const card = `
          <div class="flex items-start justify-between gap-6 py-8 border-b border-gray-100 group cursor-pointer" onclick="window.location.hash='${post.slug}'">
            <div class="flex-1 min-w-0">
              <!-- Author Block -->
              <div class="flex items-center gap-2 mb-2 text-sm text-medium">
                <span class="font-semibold text-sm">Fayadh</span>
                <span class="text-mediumlight font-normal text-[13px]">· ${formatDate(post.date)}</span>
              </div>
              
              <!-- Title -->
              <h2 class="text-[1.375rem] sm:text-[1.6rem] font-extrabold text-medium mb-2 leading-tight group-hover:underline decoration-1 underline-offset-2 tracking-tight line-clamp-2">
                ${post.title}
              </h2>
              
              <!-- Excerpt -->
              <p class="hidden sm:block text-mediumlight text-[1rem] leading-snug line-clamp-2 mb-3">
                ${post.excerpt}
              </p>
              
              <!-- Footer Meta -->
              <div class="flex items-center gap-3 text-[13px] text-mediumlight">
                <span class="bg-gray-100 px-3 py-1 rounded-full text-xs font-medium text-gray-700">${post.tags.split(',')[0]}</span>
                <span>${getReadingTime(post.excerpt)}</span>
              </div>
            </div>
            
            <!-- Thumbnail Area -->
            ${thumbnailHTML ? `<div class="flex-shrink-0 mt-2 sm:mt-0">${thumbnailHTML}</div>` : ''}
          </div>
        `;
        postsContainer.insertAdjacentHTML('beforeend', card);
      });

      const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
      if (totalPages > 1) {
        paginationControls.classList.remove('hidden');
        pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;
        btnPrev.disabled = currentPage === 1;
        btnNext.disabled = currentPage === totalPages;
      } else {
        paginationControls.classList.add('hidden');
      }
    }

    btnPrev.addEventListener('click', () => { if(currentPage > 1) { currentPage--; renderFeed(); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
    btnNext.addEventListener('click', () => { currentPage++; renderFeed(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

    function renderArticle(slug) {
      const post = allPosts.find(p => p.slug === slug);
      if (!post) { window.location.hash = ''; return; }

      // Menambahkan efek fade-in
      articleView.classList.add('fade-in');
      homeView.classList.add('hidden');
      articleView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('article-header').innerHTML = `
        <h1 class="text-[2.5rem] sm:text-[3rem] font-black text-medium leading-[1.1] tracking-tighter mb-8">${post.title}</h1>
        <div class="flex items-center gap-3 pb-8 border-b border-gray-100">
          <div class="w-12 h-12 rounded-full bg-medium text-white flex items-center justify-center font-bold text-lg shadow-sm">F</div>
          <div>
            <div class="font-medium text-medium">Fayadh</div>
            <div class="text-sm text-mediumlight mt-0.5">${getReadingTime(post.content)} · ${formatDate(post.date)}</div>
          </div>
        </div>
      `;

      document.getElementById('article-content').innerHTML = post.cleanHTML;

      document.getElementById('article-tags').innerHTML = post.tags.split(',')
          .map(tag => `<span class="bg-gray-100 hover:bg-gray-200 transition text-medium px-4 py-2 rounded-full text-sm font-medium cursor-pointer" onclick="window.location.hash=''; setTimeout(()=>setTagFilter('${tag.trim()}'), 100);">${tag.trim()}</span>`)
          .join('');

      // Render Highlighting & Tombol Copy setelah DOM selesai
      setTimeout(() => {
        Prism.highlightAll();
        mediumZoom('.prose img', { margin: 24, background: '#ffffff' });
      }, 50);
    }

    function handleRouting() {
      const hash = window.location.hash.replace('#', '');
      
      // Hapus class fade-in lama untuk me-reset animasi
      homeView.classList.remove('fade-in');
      articleView.classList.remove('fade-in');

      if (hash) {
        renderArticle(hash);
      } else {
        homeView.classList.add('fade-in');
        articleView.classList.add('hidden');
        homeView.classList.remove('hidden');
        renderFeed();
      }
    }

    window.addEventListener('hashchange', handleRouting);
    
    // Inisialisasi awal
    fetchData();
  </script>
</body>
</html>
