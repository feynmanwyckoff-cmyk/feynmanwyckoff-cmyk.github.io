<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulls, Bears, & Bugs - by Fayadh</title>
  
  <!-- Favicon B3 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23242424'/><text x='50' y='65' fill='white' font-family='Arial, sans-serif' font-weight='bold' font-size='45' text-anchor='middle'>B3</text></svg>">

  <!-- Google Fonts: Inter (UI/Heading) & Lora (Reading Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Typography Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', '-apple-system', 'sans-serif'], 
            serif: ['Lora', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            medium: '#242424', // Warna abu-abu gelap khas teks Medium
            mediumlight: '#6b6b6b'
          },
          typography: (theme) => ({
            DEFAULT: {
              css: {
                fontFamily: 'Lora, serif',
                color: '#242424',
                lineHeight: '2',
                fontSize: '1.125rem',
                h1: { fontFamily: 'Inter, sans-serif', fontWeight: '800', letterSpacing: '-0.03em', color: '#242424', lineHeight: '1.2' },
                h2: { fontFamily: 'Inter, sans-serif', fontWeight: '700', letterSpacing: '-0.02em', marginTop: '2em', color: '#242424' },
                h3: { fontFamily: 'Inter, sans-serif', fontWeight: '600', color: '#242424' },
                p: { color: '#242424' },
                pre: { backgroundColor: '#f9fafb', color: '#242424', padding: '1.25rem', borderRadius: '4px', border: '1px solid #e5e7eb', fontSize: '0.875rem' },
                code: { fontFamily: '"JetBrains Mono", monospace', fontWeight: '500', color: '#c026d3', backgroundColor: '#fdf4ff', padding: '0.2rem 0.4rem', borderRadius: '4px' },
                'code::before': { content: '""' },
                'code::after': { content: '""' },
                a: { color: '#242424', textDecoration: 'underline', textUnderlineOffset: '4px', decorationThickness: '1px', '&:hover': { color: '#6b6b6b' } },
                img: { margin: '2rem auto', borderRadius: '4px' },
                blockquote: { borderLeftWidth: '3px', borderLeftColor: '#242424', fontStyle: 'italic', paddingLeft: '1.25rem', color: '#6b6b6b' }
              }
            }
          })
        } 
      }
    }
  </script>
  
  <!-- DOMPurify for Security -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <!-- Prism.js (Syntax Highlighting) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
  <!-- Medium Zoom Library for Image Zooming -->
  <script src="https://cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>

  <style>
    /* Reset background strictly to Light */
    body { background-color: #ffffff; color: #242424; }
    /* Style custom gambar agar terlihat bisa diklik */
    .prose img { cursor: zoom-in; }
    .medium-zoom-overlay { z-index: 100; background: #ffffff !important; opacity: 0.95 !important;}
    .medium-zoom-image--opened { z-index: 101; }
  </style>
</head>
<body class="antialiased font-sans selection:bg-green-200 selection:text-black">

  <!-- Global Header Ala Medium -->
  <header class="border-b border-gray-100 sticky top-0 bg-white/95 backdrop-blur-sm z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[65px] flex items-center justify-between">
      
      <!-- Brand / Logo (Always Visible) -->
      <a href="#" onclick="window.location.hash=''; return false;" class="flex items-center gap-2 group">
        <div class="w-9 h-9 bg-medium text-white flex items-center justify-center font-sans font-bold text-lg rounded-full">B3</div>
        <span class="font-bold text-xl sm:text-2xl tracking-tight text-medium">Bulls, Bears, & Bugs</span>
      </a>

      <!-- Menu & Search -->
      <div class="flex items-center gap-4">
        <!-- Search Bar (Active) -->
        <div class="relative hidden sm:block">
          <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="search-input" placeholder="Search" class="pl-9 pr-4 py-2 bg-gray-50 hover:bg-gray-100 border-none rounded-full text-sm focus:ring-1 focus:ring-gray-300 outline-none w-48 transition-all text-medium placeholder-gray-500">
        </div>
        <!-- Write & Profile Dummy -->
        <a href="#" class="hidden md:flex items-center gap-1 text-mediumlight hover:text-medium text-sm font-medium">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="w-5 h-5"><path d="M14 4C14.2761 4 14.5 3.77614 14.5 3.5C14.5 3.22386 14.2761 3 14 3V4ZM21 10C21 9.72386 20.7761 9.5 20.5 9.5C20.2239 9.5 20 9.72386 20 10H21ZM14 3H4V4H14V3ZM3 4V20H4V4H3ZM4 21H20V20H4V21ZM21 20V10H20V20H21ZM20 21C20.5523 21 21 20.5523 21 20H20V21ZM3 20C3 20.5523 3.44771 21 4 21V20H3ZM4 3C3.44772 3 3 3.44772 3 4H4H4V3Z" fill="currentColor"></path><path d="M17.5 4.5L9.04173 12.9583C9.01429 12.9857 8.99361 13.0192 8.98134 13.056L8.15811 15.5257C8.09297 15.7211 8.2789 15.907 8.47434 15.8419L10.944 15.0187C10.9808 15.0064 11.0143 14.9857 11.0417 14.9583L19.5 6.5M17.5 4.5L19.8232 2.17678C19.9209 2.07915 20.0791 2.07915 20.1768 2.17678L21.8232 3.82322C21.9209 3.92085 21.9209 4.07915 21.8232 4.17678L19.5 6.5M17.5 4.5L19.5 6.5" stroke="currentColor"></path></svg>
          Write
        </a>
        <div class="w-8 h-8 rounded-full bg-gray-200 ml-2 border border-gray-300"></div>
      </div>
    </div>
  </header>

  <!-- HOME VIEW (Grid Utama & Sidebar Tag) -->
  <div id="home-view" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:flex gap-16">
    
    <!-- Bagian Kiri: Hero & Feed -->
    <div class="lg:w-[68%]">
      <!-- Hero Section -->
      <div class="mb-10 pb-10 border-b border-gray-100">
        <h1 class="text-[3rem] sm:text-[4rem] font-extrabold tracking-tighter text-medium leading-none mb-4">Stay curious.</h1>
        <p class="text-xl sm:text-2xl text-medium font-medium mb-4 tracking-tight">Membongkar yang rumit, menertawakan yang gagal.</p>
        <div class="border-l-4 border-medium pl-4 py-1">
           <p id="feynman-quote" class="text-lg text-mediumlight font-serif italic transition-opacity duration-500"></p>
        </div>
      </div>

      <div id="active-tag-info" class="hidden mb-6 text-sm font-semibold text-mediumlight uppercase tracking-widest border-b border-gray-100 pb-2"></div>

      <!-- Feed Container -->
      <div id="posts-container" class="flex flex-col">
        <!-- Skeleton Loader -->
        <div id="loading" class="animate-pulse space-y-10">
          <div class="flex gap-4">
            <div class="flex-1 space-y-4 py-1">
              <div class="h-4 bg-gray-200 rounded w-1/4"></div>
              <div class="h-6 bg-gray-200 rounded w-3/4"></div>
              <div class="h-4 bg-gray-200 rounded w-full"></div>
            </div>
            <div class="w-28 h-28 bg-gray-200 rounded"></div>
          </div>
          <div class="flex gap-4">
            <div class="flex-1 space-y-4 py-1">
              <div class="h-4 bg-gray-200 rounded w-1/4"></div>
              <div class="h-6 bg-gray-200 rounded w-2/3"></div>
              <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            </div>
            <div class="w-28 h-28 bg-gray-200 rounded"></div>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination-controls" class="hidden flex items-center justify-between py-10 mt-6">
        <button id="btn-prev" class="text-sm font-medium text-mediumlight hover:text-medium disabled:opacity-30 border border-gray-200 rounded-full px-4 py-1.5 transition">← Newer</button>
        <span id="page-info" class="text-sm text-mediumlight font-medium"></span>
        <button id="btn-next" class="text-sm font-medium text-mediumlight hover:text-medium disabled:opacity-30 border border-gray-200 rounded-full px-4 py-1.5 transition">Older →</button>
      </div>
    </div>

    <!-- Bagian Kanan: Sidebar Archive & Tags -->
    <div class="hidden lg:block lg:w-[32%] relative">
      <div class="sticky top-[100px]">
        <h3 class="font-bold text-medium mb-4 text-base">Discover more of what matters to you</h3>
        <div id="tags-container" class="flex flex-wrap gap-2 mb-8">
           <!-- Tags dirender oleh JS -->
        </div>
        <div class="border-t border-gray-100 pt-6 flex flex-wrap gap-x-4 gap-y-2 text-[13px] text-mediumlight">
          <a href="#" class="hover:text-medium transition">Help</a>
          <a href="#" class="hover:text-medium transition">Status</a>
          <a href="#" class="hover:text-medium transition">Writers</a>
          <a href="#" class="hover:text-medium transition">Blog</a>
          <a href="#" class="hover:text-medium transition">Careers</a>
          <a href="#" class="hover:text-medium transition">Privacy</a>
          <a href="#" class="hover:text-medium transition">Terms</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ARTICLE VIEW (Mode Baca Lengkap) -->
  <div id="article-view" class="hidden bg-white min-h-screen pb-20">
    <div class="max-w-[680px] mx-auto px-4 sm:px-6 pt-12">
      <!-- Article Header -->
      <div id="article-header" class="mb-10"></div>
      
      <!-- Article Content -->
      <div id="article-content" class="prose prose-lg sm:prose-xl max-w-none prose-headings:font-bold prose-headings:tracking-tight prose-a:text-medium prose-p:leading-relaxed"></div>
      
      <!-- Article Footer -->
      <div class="mt-12 border-t border-gray-100 pt-8 pb-10">
         <div id="article-tags" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <script>
    // ⚠️ MASUKKAN URL API GAS KAMU DI BAWAH INI
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyUmgv6BRAlyGQqIwhIXm_I3NPi3j50EUSE-fpSmRhVQ8HbgsXQlr4JRRW1M6lNDuEr6Q/exec?action=getPosts";

    // --- RICHARD FEYNMAN QUOTES ---
    const quotes = [
      "The first principle is that you must not fool yourself and you are the easiest person to fool.",
      "What I cannot create, I do not understand.",
      "I think it's much more interesting to live not knowing than to have answers which might be wrong.",
      "Physics is to math what sex is to masturbation.",
      "Study hard what interests you the most in the most undisciplined, irreverent and original manner possible.",
      "Nobody ever figures out what life is all about, and it doesn't matter."
    ];
    document.getElementById('feynman-quote').innerHTML = `"${quotes[Math.floor(Math.random() * quotes.length)]}" <br><span class="text-sm font-sans font-semibold mt-2 block">— Richard Feynman</span>`;

    // --- GLOBAL VARIABLES ---
    let allPosts = [];
    let uniqueTags = new Set();
    let currentActiveTag = null; // Untuk filter kategori/archive
    let currentPage = 1;
    const postsPerPage = 5; // Tampilkan 5 artikel per halaman

    // DOM Elements
    const homeView = document.getElementById('home-view');
    const articleView = document.getElementById('article-view');
    const postsContainer = document.getElementById('posts-container');
    const tagsContainer = document.getElementById('tags-container');
    const searchInput = document.getElementById('search-input');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageInfo = document.getElementById('page-info');
    const paginationControls = document.getElementById('pagination-controls');
    const activeTagInfo = document.getElementById('active-tag-info');

    // Utility Format
    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    
    function getReadingTime(text) {
      const words = text.split(/\s/g).length;
      return `${Math.ceil(words / 200)} min read`;
    }

    function extractThumbnail(htmlContent) {
      const imgRegex = /<img[^>]+src="([^">]+)"/i;
      const match = htmlContent.match(imgRegex);
      return match ? match[1] : null;
    }

    function stripHtmlToText(html) {
      const tmp = document.createElement("DIV");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    // Load Data
    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();
        
        if (result.success && result.data.length > 0) {
          allPosts = result.data.reverse();
          
          allPosts.forEach(post => {
            // Fix Google Drive URL
            post.content = post.content.replace(/https:\/\/drive\.google\.com\/uc\?export=view(?:&amp;|&)id=([a-zA-Z0-9_-]+)/g, 'https://lh3.googleusercontent.com/d/$1');
            post.cleanHTML = DOMPurify.sanitize(post.content);
            post.thumbnail = extractThumbnail(post.cleanHTML);
            post.excerpt = stripHtmlToText(post.cleanHTML);
            
            // Extract Tags for Archive System
            post.tags.split(',').forEach(tag => {
              const cleanTag = tag.trim();
              if(cleanTag) uniqueTags.add(cleanTag);
            });
          });

          document.getElementById('loading').remove();
          renderTags();
          handleRouting(); 
        }
      } catch (e) {
        postsContainer.innerHTML = `<p class="text-red-500 py-10">Gagal mengambil data. Cek koneksi atau URL API.</p>`;
      }
    }

    // Render Tag Archive di Sidebar
    function renderTags() {
      tagsContainer.innerHTML = Array.from(uniqueTags).map(tag => 
        `<button onclick="setTagFilter('${tag}')" class="bg-gray-100 hover:bg-gray-200 text-medium px-4 py-2 rounded-full text-sm transition-colors border border-transparent hover:border-gray-300">${tag}</button>`
      ).join('');
    }

    // Fungsi Set Filter dari Klik Tag
    window.setTagFilter = function(tag) {
      currentActiveTag = tag;
      currentPage = 1;
      searchInput.value = ''; // Reset pencarian
      window.scrollTo(0,0);
      renderFeed();
    };

    // Live Search
    searchInput.addEventListener('input', (e) => {
      currentActiveTag = null; // Reset filter tag saat mengetik
      currentPage = 1;
      renderFeed(e.target.value.toLowerCase());
    });

    // Main Render Function untuk Feed (Medium Style Vertical List)
    function renderFeed(searchQuery = '') {
      let filteredPosts = allPosts;
      
      if (currentActiveTag) {
        filteredPosts = allPosts.filter(p => p.tags.toLowerCase().includes(currentActiveTag.toLowerCase()));
        activeTagInfo.innerHTML = `Category: ${currentActiveTag} &nbsp; <button onclick="setTagFilter(null)" class="text-gray-400 hover:text-black normal-case font-normal">(Clear)</button>`;
        activeTagInfo.classList.remove('hidden');
      } else if (searchQuery) {
        filteredPosts = allPosts.filter(p => p.title.toLowerCase().includes(searchQuery) || p.excerpt.toLowerCase().includes(searchQuery));
        activeTagInfo.classList.add('hidden');
      } else {
        activeTagInfo.classList.add('hidden');
      }

      postsContainer.innerHTML = '';

      if (filteredPosts.length === 0) {
        postsContainer.innerHTML = `<p class="text-mediumlight py-10">Belum ada catatan di bagian ini.</p>`;
        paginationControls.classList.add('hidden');
        return;
      }

      // Pagination slice
      const start = (currentPage - 1) * postsPerPage;
      const paginatedPosts = filteredPosts.slice(start, start + postsPerPage);

      paginatedPosts.forEach(post => {
        // Thumbnail kotak (square) ala Medium
        const thumbnailHTML = post.thumbnail 
          ? `<img src="${post.thumbnail}" alt="${post.title}" class="w-[96px] h-[96px] sm:w-[112px] sm:h-[112px] object-cover bg-gray-50 rounded shadow-sm border border-gray-100">`
          : `<div class="w-[96px] h-[96px] sm:w-[112px] sm:h-[112px] bg-gray-50 rounded flex items-center justify-center text-gray-300 text-xs text-center border border-gray-100 px-2 shadow-sm">No Image</div>`;

        const card = `
          <div class="flex items-start justify-between gap-4 py-8 border-b border-gray-100 group cursor-pointer" onclick="window.location.hash='${post.slug}'">
            <div class="flex-1 min-w-0 pr-4">
              <!-- Author Block -->
              <div class="flex items-center gap-2 mb-2 text-sm text-mediumlight">
                <div class="w-5 h-5 rounded-full bg-medium text-white flex items-center justify-center text-[10px] font-bold">F</div>
                <span class="font-medium text-medium">Fayadh</span>
              </div>
              
              <!-- Title & Excerpt -->
              <h2 class="text-[1.25rem] sm:text-[1.375rem] font-bold text-medium mb-1.5 leading-tight group-hover:underline decoration-1 underline-offset-2 tracking-tight line-clamp-2 sm:line-clamp-3">
                ${post.title}
              </h2>
              <p class="hidden sm:block text-mediumlight font-serif leading-relaxed line-clamp-2 mb-4 pr-6">
                ${post.excerpt}
              </p>
              
              <!-- Meta Footer -->
              <div class="flex items-center gap-3 text-[13px] text-mediumlight mt-4 sm:mt-0">
                <span>${formatDate(post.date)}</span>
                <span class="w-0.5 h-0.5 bg-mediumlight rounded-full"></span>
                <span>${getReadingTime(post.excerpt)}</span>
                <span class="w-0.5 h-0.5 bg-mediumlight rounded-full hidden sm:block"></span>
                <span class="hidden sm:block bg-gray-100 px-2 py-0.5 rounded-full text-xs font-medium text-gray-600">${post.tags.split(',')[0]}</span>
              </div>
            </div>
            
            <!-- Square Thumbnail -->
            <div class="flex-shrink-0 pt-2 sm:pt-0">
              ${thumbnailHTML}
            </div>
          </div>
        `;
        postsContainer.insertAdjacentHTML('beforeend', card);
      });

      // Update Pagination UI
      const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
      if (totalPages > 1) {
        paginationControls.classList.remove('hidden');
        pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;
        btnPrev.disabled = currentPage === 1;
        btnNext.disabled = currentPage === totalPages;
      } else {
        paginationControls.classList.add('hidden');
      }
    }

    // Pagination Events
    btnPrev.addEventListener('click', () => { if(currentPage > 1) { currentPage--; renderFeed(); window.scrollTo(0,0); } });
    btnNext.addEventListener('click', () => { currentPage++; renderFeed(); window.scrollTo(0,0); });

    // Render Full Article
    function renderArticle(slug) {
      const post = allPosts.find(p => p.slug === slug);
      if (!post) { window.location.hash = ''; return; }

      homeView.classList.add('hidden');
      articleView.classList.remove('hidden');
      window.scrollTo(0, 0);

      document.getElementById('article-header').innerHTML = `
        <h1 class="text-[2.5rem] sm:text-[3rem] font-extrabold text-medium leading-[1.1] tracking-tight mb-8">${post.title}</h1>
        <div class="flex items-center gap-4 pb-8 border-b border-gray-100">
          <div class="w-12 h-12 rounded-full bg-medium text-white flex items-center justify-center font-bold text-lg shadow-sm">F</div>
          <div>
            <div class="font-medium text-medium">Fayadh</div>
            <div class="text-sm text-mediumlight mt-0.5">${getReadingTime(post.content)} · ${formatDate(post.date)}</div>
          </div>
        </div>
      `;

      document.getElementById('article-content').innerHTML = post.cleanHTML;

      document.getElementById('article-tags').innerHTML = post.tags.split(',')
          .map(tag => `<span class="bg-gray-100 text-mediumlight px-4 py-2 rounded-full text-sm font-medium">${tag.trim()}</span>`)
          .join('');

      // Inisialisasi Highlighting Code & Image Zoom
      Prism.highlightAll();
      mediumZoom('.prose img', { margin: 24, background: '#ffffff' });
    }

    // Routing Logic
    function handleRouting() {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        renderArticle(hash);
      } else {
        homeView.classList.remove('hidden');
        articleView.classList.add('hidden');
        renderFeed();
      }
    }

    window.addEventListener('hashchange', handleRouting);
    
    // Mulai Ambil Data
    fetchData();
  </script>
</body>
</html>
